name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-android:
    name: E2E Android (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_LEVEL: '34'
      ARCH: x86_64
      STARTUP_TIMEOUT: '60'
      TEST_TIMEOUT: '720'
      BUNDLE_ID: com.example
      # Must match E2E_PORT default in example/e2e-server.mjs and the port
      # baked into example/src/__tests__/e2eServer.ts.
      E2E_PORT: '8099'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies (root)
        run: yarn install --immutable

      - name: Build library (yarn prepare - tsc + nitrogen)
        run: yarn prepare

      - name: Install dependencies (example)
        working-directory: example
        run: yarn install --immutable

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-e2e-${{ runner.os }}-${{ hashFiles('example/android/**/*.gradle*', 'example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-e2e-${{ runner.os }}-

      - name: Build debug APK
        working-directory: example/android
        run: ./gradlew :app:assembleDebug --no-daemon --build-cache

      - name: Stop Gradle daemon
        working-directory: example/android
        run: ./gradlew --stop

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.ARCH }}

      - name: Create AVD and generate snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: ${{ env.ARCH }}
          # Must match the AVD name androidEmulator() uses in rn-harness.config.mjs,
          # or the harness looks for a device that was never booted.
          avd-name: e2e_avd
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run E2E on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: ${{ env.ARCH }}
          avd-name: e2e_avd
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 240
          script: |
            set -euo pipefail
            adb wait-for-device
            SERIAL=$(adb get-serialno)
            adb -s "$SERIAL" install -r example/android/app/build/outputs/apk/debug/app-debug.apk
            node example/scripts/run-regression.mjs android "$SERIAL"

      - name: Upload Android regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-regression
          path: example/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  e2e-ios:
    name: E2E iOS (simulator)
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'e2e-ios')
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # Keep Xcode and runtime compatible; macos-15 defaults to Xcode 16.4.
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
      SIM_DEVICE: iPhone 17 Pro
      SIM_OS: '26.1'
      # Must match E2E_PORT default in example/e2e-server.mjs and the port
      # baked into example/src/__tests__/e2eServer.ts.
      E2E_PORT: '8099'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Ruby (bundler cache)
        uses: ruby/setup-ruby@v1
        with:
          # Gemfile only has a range constraint (>= 2.6.10), so setup-ruby
          # cannot infer a version and fails without an explicit one.
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: example

      - name: Install dependencies (root)
        run: yarn install --immutable

      - name: Build library (yarn prepare - tsc + nitrogen)
        run: yarn prepare

      - name: Install dependencies (example)
        working-directory: example
        run: yarn install --immutable

      - name: Pods cache
        uses: actions/cache@v4
        with:
          path: example/ios/Pods
          key: pods-e2e-${{ runner.os }}-${{ hashFiles('example/ios/Podfile.lock') }}
          restore-keys: |
            pods-e2e-${{ runner.os }}-

      - name: Show selected Xcode and runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install CocoaPods
        working-directory: example/ios
        run: bundle exec pod install

      # Resolve a real device before passing its UDID to xcodebuild.
      - name: Boot simulator
        id: sim
        uses: futureware-tech/simulator-action@e89aa8f93d3aec35083ff49d2854d07f7186f7f5 # v5
        with:
          model: ${{ env.SIM_DEVICE }}
          os_version: ${{ env.SIM_OS }}
          wait_for_boot: true

      - name: Resolve booted simulator for harness
        run: node example/scripts/resolve-booted-simulator.mjs
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}

      - name: Build app for simulator
        working-directory: example/ios
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace example.xcworkspace \
            -scheme example \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Install app on simulator
        working-directory: example/ios
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products -name 'example.app' -type d | head -1)
          echo "Installing $APP_PATH"
          xcrun simctl install "$SIM_UDID" "$APP_PATH"

      - name: Run AppRegistry regressions (iOS)
        run: node example/scripts/run-regression.mjs ios "$SIM_UDID"

      - name: Upload iOS regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-regression
          path: example/artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Capture simulator screenshot on failure
        if: failure()
        run: |
          mkdir -p artifacts
          xcrun simctl io "$SIM_UDID" screenshot artifacts/ios-failure.png || true

      - name: Upload iOS failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-failure-screenshot
          path: artifacts/ios-failure.png
          if-no-files-found: ignore
          retention-days: 7
