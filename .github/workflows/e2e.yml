name: E2E

on:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit to verify
        type: string
        default: ''
      packed:
        description: Verify the release archive on both platforms
        type: boolean
        default: false
      ios_profile:
        description: iOS regression profile
        type: string
        default: ios-core
      candidate_artifact:
        description: Artifact containing the archive, metadata, and source bundle
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ios_profile:
        description: iOS regression profile
        type: choice
        options: [ios-core, full]
        default: ios-core
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feature/**']
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: e2e-${{ inputs.ref || github.ref }}-${{ inputs.packed && 'packed' || 'linked' }}
  cancel-in-progress: ${{ !inputs.packed }}

env:
  CANDIDATE_DIR: ${{ github.workspace }}-release-candidate

jobs:
  e2e-android:
    name: E2E Android (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_LEVEL: '34'
      ARCH: x86_64
      STARTUP_TIMEOUT: '60'
      TEST_TIMEOUT: '720'
      BUNDLE_ID: com.example
      # Must match E2E_PORT default in example/e2e-server.mjs and the port
      # baked into example/src/__tests__/e2eServer.ts.
      E2E_PORT: '8099'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.packed && github.sha || inputs.ref || github.sha }}

      - name: Download release candidate
        if: inputs.packed
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.candidate_artifact }}
          path: ${{ env.CANDIDATE_DIR }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Restore exact release source
        if: inputs.packed
        env:
          SOURCE_SHA: ${{ inputs.ref }}
        run: node scripts/release-candidate.mjs restore "$CANDIDATE_DIR" "$SOURCE_SHA"

      - name: Install dependencies (root)
        run: yarn install --immutable

      - name: Build TypeScript library (yarn prepare)
        run: yarn prepare

      - name: Install dependencies (example)
        if: ${{ !inputs.packed }}
        working-directory: example
        run: yarn install --immutable

      - name: Install and verify packed native dependency
        if: inputs.packed
        env:
          SOURCE_SHA: ${{ inputs.ref }}
        run: node scripts/release-candidate.mjs install "$CANDIDATE_DIR" "$SOURCE_SHA" android

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-e2e-${{ runner.os }}-${{ hashFiles('example/android/**/*.gradle*', 'example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-e2e-${{ runner.os }}-

      - name: Build debug APK
        working-directory: example/android
        run: ./gradlew :app:assembleDebug --no-daemon --build-cache --max-workers=2 -PreactNativeArchitectures=x86_64

      - name: Stop Gradle daemon
        working-directory: example/android
        run: ./gradlew --stop

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.ARCH }}-camera-emulated

      - name: Create AVD and generate snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: ${{ env.ARCH }}
          # Must match the AVD name androidEmulator() uses in rn-harness.config.mjs,
          # or the harness looks for a device that was never booted.
          avd-name: e2e_avd
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run E2E on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: ${{ env.ARCH }}
          avd-name: e2e_avd
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          disable-animations: true
          emulator-boot-timeout: 240
          script: |
            adb -s "$ANDROID_SERIAL" wait-for-device
            adb -s "$ANDROID_SERIAL" install -r example/android/app/build/outputs/apk/debug/app-debug.apk
            node example/scripts/run-regression.mjs android "$ANDROID_SERIAL"

      - name: Upload Android regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-regression
          path: example/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  e2e-ios:
    name: E2E iOS (simulator)
    if: >-
      inputs.packed ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'e2e-ios')
    runs-on: macos-15
    timeout-minutes: ${{ inputs.ios_profile == 'full' && 45 || 25 }}
    env:
      # Keep Xcode and runtime compatible; macos-15 defaults to Xcode 16.4.
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
      IOS_PROFILE: ${{ inputs.ios_profile || 'ios-core' }}
      CONFIGURATION: ${{ inputs.ios_profile == 'full' && 'Debug' || 'Release' }}
      # Must match E2E_PORT default in example/e2e-server.mjs and the port
      # baked into example/src/__tests__/e2eServer.ts.
      E2E_PORT: '8099'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.packed && github.sha || inputs.ref || github.sha }}

      - name: Download release candidate
        if: inputs.packed
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.candidate_artifact }}
          path: ${{ env.CANDIDATE_DIR }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Restore exact release source
        if: inputs.packed
        env:
          SOURCE_SHA: ${{ inputs.ref }}
        run: node scripts/release-candidate.mjs restore "$CANDIDATE_DIR" "$SOURCE_SHA"

      - name: Setup Ruby (bundler cache)
        uses: ruby/setup-ruby@v1
        with:
          # Gemfile only has a range constraint (>= 2.6.10), so setup-ruby
          # cannot infer a version and fails without an explicit one.
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: example

      - name: Install dependencies (root)
        run: yarn install --immutable

      - name: Build TypeScript library (yarn prepare)
        run: yarn prepare

      - name: Install dependencies (example)
        if: ${{ !inputs.packed }}
        working-directory: example
        run: yarn install --immutable

      - name: Install and verify packed native dependency
        if: inputs.packed
        env:
          SOURCE_SHA: ${{ inputs.ref }}
        run: node scripts/release-candidate.mjs install "$CANDIDATE_DIR" "$SOURCE_SHA" ios

      - name: Pods cache
        uses: actions/cache@v4
        with:
          path: example/ios/Pods
          key: pods-e2e-${{ runner.os }}-${{ hashFiles('example/ios/Podfile.lock') }}
          restore-keys: |
            pods-e2e-${{ runner.os }}-

      - name: Show selected Xcode
        run: xcodebuild -version

      - name: Install CocoaPods
        timeout-minutes: 5
        working-directory: example/ios
        run: bundle exec pod install

      - name: Build app for simulator
        timeout-minutes: 15
        working-directory: example/ios
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace example.xcworkspace \
            -scheme example \
            -configuration "$CONFIGURATION" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -jobs 2 \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES ARCHS="$(uname -m)" \
            build

      - name: Create and boot dedicated simulator
        timeout-minutes: 4
        run: node example/scripts/prepare-ios-simulator.mjs

      - name: Install app on simulator
        timeout-minutes: 3
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          execFileSync('xcrun', ['simctl', 'install', process.env.SIM_UDID,
            `example/ios/build/Build/Products/${process.env.CONFIGURATION}-iphonesimulator/example.app`],
            { stdio: 'inherit', timeout: 120000, killSignal: 'SIGKILL' })
          NODE

      - name: Run AppRegistry regressions (iOS)
        timeout-minutes: ${{ inputs.ios_profile == 'full' && 20 || 6 }}
        run: node example/scripts/run-regression.mjs ios "$SIM_UDID" "$IOS_PROFILE"

      - name: Upload iOS regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-regression
          path: example/artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Delete dedicated simulator
        if: always() && env.SIM_UDID != ''
        timeout-minutes: 1
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          try {
            execFileSync('xcrun', ['simctl', 'delete', process.env.SIM_UDID],
              { stdio: 'inherit', timeout: 20000, killSignal: 'SIGKILL' })
          } catch (error) { console.error(error.message) }
          NODE

  packed-release-gate:
    name: Require complete packed regressions
    if: ${{ always() && inputs.packed }}
    needs:
      - e2e-android
      - e2e-ios
    runs-on: ubuntu-latest
    steps:
      - name: Require both platform jobs to succeed
        env:
          ANDROID_RESULT: ${{ needs.e2e-android.result }}
          IOS_RESULT: ${{ needs.e2e-ios.result }}
        run: test "$ANDROID_RESULT" = success && test "$IOS_RESULT" = success

      - name: Checkout regression validator
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download Android evidence
        uses: actions/download-artifact@v4
        with:
          name: android-regression
          path: evidence/android

      - name: Download iOS evidence
        uses: actions/download-artifact@v4
        with:
          name: ios-regression
          path: evidence/ios

      - name: Require exact source, archive, and scenario coverage
        env:
          IOS_PROFILE: ${{ inputs.ios_profile || 'ios-core' }}
          SOURCE_SHA: ${{ inputs.ref }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          import { validateRegressionResults } from './example/scripts/run-regression.mjs'
          const read = path => JSON.parse(readFileSync(path, 'utf8'))
          const android = read('evidence/android/release-candidate.json')
          const ios = read('evidence/ios/release-candidate.json')
          for (const [platform, candidate] of [['android', android], ['ios', ios]]) {
            assert.equal(candidate.source_sha, process.env.SOURCE_SHA)
            assert.equal(candidate.platform, platform)
            validateRegressionResults(read(`evidence/${platform}/${platform}-regression-results.json`), platform, platform === 'ios' ? process.env.IOS_PROFILE : 'full')
          }
          assert.equal(android.integrity, ios.integrity)
          assert.equal(android.version, ios.version)
          console.log(JSON.stringify({ source_sha: android.source_sha, integrity: android.integrity, version: android.version }))
          NODE
