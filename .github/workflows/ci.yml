name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feature/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            native:
              - 'src/**'
              - 'cpp/**'
              - 'ios/**'
              - 'android/**'
              - 'nitrogen/**'
              - 'nitro.json'
              - 'example/**'
              - 'package.json'
              - 'yarn.lock'
              - 'scripts/check-package.mjs'
              - 'type-tests/**'
              - '.github/workflows/ci.yml'

  validate:
    name: Validate (lint, typecheck, codegen, TS tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint (ESLint, --max-warnings 0)
        run: yarn lint-ci

      - name: Setup JDK 17 for ktlint
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Check handwritten Kotlin with ktlint 1.8.0
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 10 --max-time 180 \
            https://github.com/ktlint/ktlint/releases/download/1.8.0/ktlint \
            --output "$RUNNER_TEMP/ktlint"
          printf '%s  %s\n' a3fd620207d5c40da6ca789b95e7f823c54e854b7fade7f613e91096a3706d75 "$RUNNER_TEMP/ktlint" | sha256sum --check
          java -Xmx256m -jar "$RUNNER_TEMP/ktlint" 'android/src/**/*.kt' 'example/android/app/src/**/*.kt'

      - name: Typecheck (tsc --noEmit)
        run: yarn typecheck

      - name: Verify generated native bindings
        run: yarn check:codegen

      - name: Run host TS tests (node --test)
        run: yarn test

      - name: Test release candidate verification
        run: node --test scripts/__tests__/*.test.mjs

      - name: Install playground dependencies
        working-directory: example
        run: yarn install --immutable

      - name: Test AppRegistry regression fixture and runner
        run: node --test example/scripts/__tests__/*.test.mjs

      - name: Typecheck and test playground behavior
        working-directory: example
        env:
          NODE_OPTIONS: --max-old-space-size=768
        run: |
          yarn tsc --noEmit
          yarn test --runInBand

  package-smoke:
    name: Packed consumer (${{ matrix.label }})
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - label: lower
            react: 19.3.0
            rn: 0.88.0
            nitro: 0.37.1
          - label: upper
            react: 19.3.1
            rn: 0.88.0
            nitro: 0.37.1
    env:
      PACKAGE_REACT_VERSION: ${{ matrix.react }}
      PACKAGE_RN_VERSION: ${{ matrix.rn }}
      PACKAGE_NITRO_VERSION: ${{ matrix.nitro }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check package validator failure cases
        run: node scripts/check-package.mjs --self-test

      - name: Check tarball files and isolated public types
        run: yarn test:package

  swift-test:
    name: Swift tests (XCTest)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies (root)
        run: yarn install --immutable

      - name: Build TypeScript library (yarn prepare)
        run: yarn prepare

      - name: Run Swift tests
        working-directory: iosTests
        run: swift test --jobs 2

  robolectric:
    name: Android unit tests (Robolectric)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies (root)
        run: yarn install --immutable

      - name: Build TypeScript library (yarn prepare)
        run: yarn prepare

      - name: Install dependencies (example)
        working-directory: example
        run: yarn install --immutable

      - name: Gradle cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('example/android/**/*.gradle*', 'example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run Robolectric suite
        working-directory: example/android
        run: ./gradlew :nitro-webview:testDebugUnitTest --no-daemon --build-cache --max-workers=2 -PreactNativeArchitectures=x86_64

      - name: Stop Gradle daemon
        if: always()
        working-directory: example/android
        run: ./gradlew --stop

  build-android:
    name: Example app compile (Android assembleDebug)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies (root)
        run: yarn install --immutable

      - name: Build TypeScript library (yarn prepare)
        run: yarn prepare

      - name: Install dependencies (example)
        working-directory: example
        run: yarn install --immutable

      - name: Gradle cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('example/android/**/*.gradle*', 'example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Assemble debug APK
        working-directory: example/android
        run: ./gradlew :app:assembleDebug --no-daemon --build-cache --max-workers=2 -PreactNativeArchitectures=x86_64

      - name: Stop Gradle daemon
        if: always()
        working-directory: example/android
        run: ./gradlew --stop

  build-ios:
    name: Example app compile (iOS simulator)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Ruby (bundler cache)
        uses: ruby/setup-ruby@v1
        with:
          # Gemfile only has a range constraint (>= 2.6.10), so setup-ruby
          # cannot infer a version and fails without an explicit one.
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: example

      - name: Install dependencies (root)
        run: yarn install --immutable

      - name: Build TypeScript library (yarn prepare)
        run: yarn prepare

      - name: Install dependencies (example)
        working-directory: example
        run: yarn install --immutable

      - name: Pods cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: example/ios/Pods
          # No restore-keys: a Pods/ dir from another lock pins stale local podspecs (e.g. hermes-engine) and fails pod install.
          key: pods-${{ runner.os }}-${{ hashFiles('example/ios/Podfile.lock') }}

      - name: Install CocoaPods
        working-directory: example/ios
        run: bundle exec pod install

      - name: Compile app (xcodebuild, no code signing)
        working-directory: example/ios
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace example.xcworkspace \
            -scheme example \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -jobs 2 \
            CODE_SIGNING_ALLOWED=NO \
            build
